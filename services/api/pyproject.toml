[project]
name = "healthtrack-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rasmus Kuusmaa", email = "77f315@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
healthtrack-api = "healthtrack_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
