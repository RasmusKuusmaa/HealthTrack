[project]
name = "healthtrack-api"
version = "0.1.0"
description = "HealthTrack backend API"
authors = [
    { name = "Rasmus Kuusmaa", email = "77f315@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=4.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.4",
    "zxcvbn>=4.5.0",
]

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.mypy.overrides]]
module = "zxcvbn"
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "B008",  # FastAPI's `Depends()` default-argument pattern is idiomatic.
]
