name: Backend

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: services/api

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthtrack
          POSTGRES_PASSWORD: healthtrack
          POSTGRES_DB: healthtrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://healthtrack:healthtrack@localhost:5432/healthtrack
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy .

      - name: Run tests
        run: uv run pytest
