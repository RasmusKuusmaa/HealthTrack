repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/api/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^services/api/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^services/api/
        additional_dependencies: [pydantic]

  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: ^apps/mobile/.*\.dart$

      - id: eslint
        name: eslint
        entry: bash -c 'cd apps/web && npx eslint --fix "$@"' --
        language: system
        files: ^apps/web/.*\.(js|jsx|ts|tsx)$

      - id: prettier
        name: prettier
        entry: bash -c 'cd apps/web && npx prettier --write "$@"' --
        language: system
        files: ^apps/web/.*\.(js|jsx|ts|tsx|json|css|md)$
